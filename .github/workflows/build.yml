name: Build Melodic-Atlas VST3/AU

on:
  push:
    branches: [ "main", "master", "dev/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Keep an already-running build alive while developing. In-progress
# macOS builds must not be cancelled by subsequent branch updates.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact_name: Melodic-Atlas-macOS-Universal
          - os: windows-latest
            artifact_name: Melodic-Atlas-Windows-x64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Plugin (Release)
        run: cmake --build build --config Release --parallel 4

      - name: Upload Built Plugins
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            build/MelodicAtlas_artefacts/Release/VST3/**
            build/MelodicAtlas_artefacts/Release/AU/**
            build/MelodicAtlas_artefacts/Release/Standalone/**
