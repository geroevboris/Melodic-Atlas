name: Build Melodic-Atlas VST3/AU

on:
  push:
    branches: [ "main", "master", "dev/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Keep an already-running build alive while developing. In-progress
# macOS builds must not be cancelled by subsequent branch updates.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            artifact_name: Melodic-Atlas-macOS-Universal
          - os: windows-latest
            artifact_name: Melodic-Atlas-Windows-x64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python for native 8B packaging
        if: startsWith(github.ref, 'refs/heads/dev/8b-')
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch pinned local CLAP and ONNX Runtime (build-time only)
        if: startsWith(github.ref, 'refs/heads/dev/8b-')
        shell: bash
        run: |
          python Tools/fetch_clap_onnx_8b.py build/assets/clap_audio.onnx
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            python Tools/prepare_native_runtime_8b.py macos build/native
          else
            python Tools/prepare_native_runtime_8b.py windows build/native
          fi

      - name: Configure Native CLAP CMake (8B)
        if: startsWith(github.ref, 'refs/heads/dev/8b-')
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            ort="$GITHUB_WORKSPACE/build/native/onnxruntime-osx-universal2-1.22.0"
          else
            ort="$GITHUB_WORKSPACE/build/native/onnxruntime-win-x64-1.22.1"
          fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DATLAS_ENABLE_NATIVE_CLAP=ON \
            "-DATLAS_ONNXRUNTIME_ROOT=$ort" \
            "-DATLAS_CLAP_MODEL_PATH=$GITHUB_WORKSPACE/build/assets/clap_audio.onnx"

      - name: Configure CMake (legacy/other branches)
        if: "!startsWith(github.ref, 'refs/heads/dev/8b-')"
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Plugin (Release)
        run: cmake --build build --config Release --parallel 4

      - name: Verify bundled native CLAP weights and runtime (8B)
        if: startsWith(github.ref, 'refs/heads/dev/8b-')
        run: python Tools/verify_native_bundle_8b.py

      - name: Upload Built Plugins
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            build/MelodicAtlas_artefacts/Release/VST3/**
            build/MelodicAtlas_artefacts/Release/AU/**
            build/MelodicAtlas_artefacts/Release/Standalone/**
