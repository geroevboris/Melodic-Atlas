name: Build Melodic-Atlas VST3/AU

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: Melodic-Atlas-macOS
            cmake_args: "-DCMAKE_OSX_ARCHITECTURES=\"arm64;x86_64\""
          - os: windows-latest
            artifact_name: Melodic-Atlas-Windows
            cmake_args: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build Plugin (Release)
        run: cmake --build build --config Release --parallel 4

      - name: Upload Built Plugins
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            build/MelodicAtlas_artefacts/Release/VST3/**
            build/MelodicAtlas_artefacts/Release/AU/**
            build/MelodicAtlas_artefacts/Release/Standalone/**
