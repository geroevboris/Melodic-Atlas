name: Build Melodic-Atlas VST3/AU

on:
  push:
    branches: [ "main", "master", "dev/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Keep an already-running build alive while developing. In-progress
# macOS builds must not be cancelled by subsequent branch updates.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  clap-validation-smoke:
    name: CLAP validation format and scoring tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test blinded-label evaluation and native embedding cache parsing
        run: python -m unittest discover -s Tools -p 'test_clap_validation.py' -v
      - name: Test minimum 2-second duration policy
        run: |
          c++ -std=c++17 -Wall -Wextra -pedantic -ISource Tools/test_duration_policy.cpp -o /tmp/atlas-duration-test
          /tmp/atlas-duration-test
      - name: Test explicit drum-loop filename recognition
        run: python -m unittest discover -s Tools -p 'test_drum_naming_8p.py' -v
      - name: Validate static CLAP text bank data and Winds split
        run: python -m unittest discover -s Tools -p 'test_clap_bank_9c.py' -v
      - name: Test actual 9E production drum-loop gate
        run: |
          c++ -std=c++17 -Wall -Wextra -pedantic -ISource Tools/test_drumloop_9e.cpp -o /tmp/atlas-drumloop-9e
          /tmp/atlas-drumloop-9e
      - name: Test 9F rhythm structure and actual drum-loop decisions
        run: |
          c++ -std=c++17 -Wall -Wextra -pedantic -ISource Tools/test_rhythm_sequence_9f.cpp -o /tmp/atlas-rhythm-9f
          /tmp/atlas-rhythm-9f
          c++ -std=c++17 -Wall -Wextra -pedantic -ISource Tools/test_drumloop_9f.cpp -o /tmp/atlas-drumloop-9f
          /tmp/atlas-drumloop-9f
      - name: Verify hierarchy 05 compressed bank and abstention policy
        run: |
          python -m unittest discover -s Tools -p 'test_hierarchy05_bank.py' -v
          c++ -std=c++17 -Wall -Wextra -pedantic -ISource Tools/test_hierarchy05_policy.cpp -o /tmp/atlas-hierarchy05
          /tmp/atlas-hierarchy05
      - name: Verify conservative primary family recovery 06
        run: |
          c++ -std=c++17 -Wall -Wextra -pedantic -ISource Tools/test_primary06_policy.cpp -o /tmp/atlas-primary06
          /tmp/atlas-primary06
      - name: Verify complete dynamic category taxonomy 07
        run: |
          c++ -std=c++17 -Wall -Wextra -pedantic -ISource Tools/test_dynamic_taxonomy07_policy.cpp -o /tmp/atlas-dynamic07
          /tmp/atlas-dynamic07
          python -m unittest discover -s Tools -p 'test_dynamic_taxonomy07_contract.py' -v
      - name: Verify final Electric Pulse and Dice Cloud UI contract
        run: python -m unittest discover -s Tools -p 'test_ui_polish_08.py' -v

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            artifact_name: Melodic-Atlas-macOS-Universal
          - os: windows-latest
            artifact_name: Melodic-Atlas-Windows-x64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python for native 8B packaging
        if: (startsWith(github.ref, 'refs/heads/dev/8b-') || startsWith(github.ref, 'refs/heads/dev/8c-') || (startsWith(github.ref, 'refs/heads/dev/8d-') || (startsWith(github.ref, 'refs/heads/dev/8e-') || (startsWith(github.ref, 'refs/heads/dev/8f-') || (startsWith(github.ref, 'refs/heads/dev/8g-') || (startsWith(github.ref, 'refs/heads/dev/8h-') || (startsWith(github.ref, 'refs/heads/dev/8i-') || (startsWith(github.ref, 'refs/heads/dev/8j-') || (startsWith(github.ref, 'refs/heads/dev/8k-') || startsWith(github.ref, 'refs/heads/dev/8m-') || startsWith(github.ref, 'refs/heads/dev/8n-') || startsWith(github.ref, 'refs/heads/dev/8o-') || startsWith(github.ref, 'refs/heads/dev/8p-') || startsWith(github.ref, 'refs/heads/dev/9c-') || startsWith(github.ref, 'refs/heads/dev/9e-') || startsWith(github.ref, 'refs/heads/dev/9f-'))))))))))
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch pinned local CLAP and ONNX Runtime (build-time only)
        if: (startsWith(github.ref, 'refs/heads/dev/8b-') || startsWith(github.ref, 'refs/heads/dev/8c-') || (startsWith(github.ref, 'refs/heads/dev/8d-') || (startsWith(github.ref, 'refs/heads/dev/8e-') || (startsWith(github.ref, 'refs/heads/dev/8f-') || (startsWith(github.ref, 'refs/heads/dev/8g-') || (startsWith(github.ref, 'refs/heads/dev/8h-') || (startsWith(github.ref, 'refs/heads/dev/8i-') || (startsWith(github.ref, 'refs/heads/dev/8j-') || (startsWith(github.ref, 'refs/heads/dev/8k-') || startsWith(github.ref, 'refs/heads/dev/8m-') || startsWith(github.ref, 'refs/heads/dev/8n-') || startsWith(github.ref, 'refs/heads/dev/8o-') || startsWith(github.ref, 'refs/heads/dev/8p-') || startsWith(github.ref, 'refs/heads/dev/9c-') || startsWith(github.ref, 'refs/heads/dev/9e-') || startsWith(github.ref, 'refs/heads/dev/9f-'))))))))))
        shell: bash
        run: |
          python Tools/fetch_clap_onnx_8b.py build/assets/clap_audio.onnx
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            python Tools/prepare_native_runtime_8b.py macos build/native
          else
            python Tools/prepare_native_runtime_8b.py windows build/native
          fi

      - name: Configure Native CLAP CMake (8B)
        if: (startsWith(github.ref, 'refs/heads/dev/8b-') || startsWith(github.ref, 'refs/heads/dev/8c-') || (startsWith(github.ref, 'refs/heads/dev/8d-') || (startsWith(github.ref, 'refs/heads/dev/8e-') || (startsWith(github.ref, 'refs/heads/dev/8f-') || (startsWith(github.ref, 'refs/heads/dev/8g-') || (startsWith(github.ref, 'refs/heads/dev/8h-') || (startsWith(github.ref, 'refs/heads/dev/8i-') || (startsWith(github.ref, 'refs/heads/dev/8j-') || (startsWith(github.ref, 'refs/heads/dev/8k-') || startsWith(github.ref, 'refs/heads/dev/8m-') || startsWith(github.ref, 'refs/heads/dev/8n-') || startsWith(github.ref, 'refs/heads/dev/8o-') || startsWith(github.ref, 'refs/heads/dev/8p-') || startsWith(github.ref, 'refs/heads/dev/9c-') || startsWith(github.ref, 'refs/heads/dev/9e-') || startsWith(github.ref, 'refs/heads/dev/9f-'))))))))))
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            ort="$GITHUB_WORKSPACE/build/native/onnxruntime-osx-universal2-1.19.2"
          else
            ort="$GITHUB_WORKSPACE/build/native/onnxruntime-win-x64-1.22.1"
          fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DATLAS_ENABLE_NATIVE_CLAP=ON \
            "-DATLAS_ONNXRUNTIME_ROOT=$ort" \
            "-DATLAS_CLAP_MODEL_PATH=$GITHUB_WORKSPACE/build/assets/clap_audio.onnx"

      - name: Configure CMake (legacy/other branches)
        if: "!(startsWith(github.ref, 'refs/heads/dev/8b-') || startsWith(github.ref, 'refs/heads/dev/8c-') || (startsWith(github.ref, 'refs/heads/dev/8d-') || (startsWith(github.ref, 'refs/heads/dev/8e-') || (startsWith(github.ref, 'refs/heads/dev/8f-') || (startsWith(github.ref, 'refs/heads/dev/8g-') || (startsWith(github.ref, 'refs/heads/dev/8h-') || (startsWith(github.ref, 'refs/heads/dev/8i-') || (startsWith(github.ref, 'refs/heads/dev/8j-') || (startsWith(github.ref, 'refs/heads/dev/8k-') || startsWith(github.ref, 'refs/heads/dev/8m-') || startsWith(github.ref, 'refs/heads/dev/8n-') || startsWith(github.ref, 'refs/heads/dev/8o-') || startsWith(github.ref, 'refs/heads/dev/8p-') || startsWith(github.ref, 'refs/heads/dev/9c-') || startsWith(github.ref, 'refs/heads/dev/9e-') || startsWith(github.ref, 'refs/heads/dev/9f-'))))))))))"
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Plugin (Release)
        run: cmake --build build --config Release --parallel 4

      - name: Diagnose macOS plugin loading and dynamic linkage (8B)
        if: (startsWith(github.ref, 'refs/heads/dev/8b-') || startsWith(github.ref, 'refs/heads/dev/8c-') || (startsWith(github.ref, 'refs/heads/dev/8d-') || (startsWith(github.ref, 'refs/heads/dev/8e-') || (startsWith(github.ref, 'refs/heads/dev/8f-') || (startsWith(github.ref, 'refs/heads/dev/8g-') || (startsWith(github.ref, 'refs/heads/dev/8h-') || (startsWith(github.ref, 'refs/heads/dev/8i-') || (startsWith(github.ref, 'refs/heads/dev/8j-') || (startsWith(github.ref, 'refs/heads/dev/8k-') || startsWith(github.ref, 'refs/heads/dev/8m-') || startsWith(github.ref, 'refs/heads/dev/8n-') || startsWith(github.ref, 'refs/heads/dev/8o-') || startsWith(github.ref, 'refs/heads/dev/8p-') || startsWith(github.ref, 'refs/heads/dev/9c-') || startsWith(github.ref, 'refs/heads/dev/9e-') || startsWith(github.ref, 'refs/heads/dev/9f-')))))))))) && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          vst="build/MelodicAtlas_artefacts/Release/VST3/Melodic-Atlas.vst3"
          au="build/MelodicAtlas_artefacts/Release/AU/Melodic-Atlas.component"
          for bundle in "$vst" "$au"; do
            echo "=== $bundle ==="
            find "$bundle/Contents" -maxdepth 3 -type f -print
            binary="$(find "$bundle/Contents/MacOS" -type f -maxdepth 1 | head -1)"
            echo "--- architectures ---"
            lipo -info "$binary"
            echo "--- minimum macOS deployment target ---"
            xcrun vtool -show-build "$binary" || true
            echo "--- dynamic libraries ---"
            otool -L "$binary"
            echo "--- runtime search paths ---"
            otool -l "$binary" | grep -A 3 LC_RPATH || true
            echo "--- signatures ---"
            codesign -dv --verbose=2 "$bundle" 2>&1 || true
            codesign --verify --deep --strict --verbose=2 "$bundle" 2>&1 || true
            echo "--- dependency verification ---"
            dylib="$bundle/Contents/Frameworks/libonnxruntime.dylib"
            xcrun vtool -show-build "$dylib"
            otool -D "$dylib"
            otool -L "$dylib" | head -25
            codesign --verify --verbose=2 "$dylib" 2>&1 || true
          done
          echo "--- host OS ---"
          sw_vers

      - name: Validate AU in macOS AudioComponentRegistrar (8B)
        if: (startsWith(github.ref, 'refs/heads/dev/8b-') || startsWith(github.ref, 'refs/heads/dev/8c-') || (startsWith(github.ref, 'refs/heads/dev/8d-') || (startsWith(github.ref, 'refs/heads/dev/8e-') || (startsWith(github.ref, 'refs/heads/dev/8f-') || (startsWith(github.ref, 'refs/heads/dev/8g-') || (startsWith(github.ref, 'refs/heads/dev/8h-') || (startsWith(github.ref, 'refs/heads/dev/8i-') || (startsWith(github.ref, 'refs/heads/dev/8j-') || (startsWith(github.ref, 'refs/heads/dev/8k-') || startsWith(github.ref, 'refs/heads/dev/8m-') || startsWith(github.ref, 'refs/heads/dev/8n-') || startsWith(github.ref, 'refs/heads/dev/8o-') || startsWith(github.ref, 'refs/heads/dev/8p-') || startsWith(github.ref, 'refs/heads/dev/9c-') || startsWith(github.ref, 'refs/heads/dev/9e-') || startsWith(github.ref, 'refs/heads/dev/9f-')))))))))) && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          cp -R "build/MelodicAtlas_artefacts/Release/AU/Melodic-Atlas.component" \
            "$HOME/Library/Audio/Plug-Ins/Components/"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          echo "--- Audio Units registration ---"
          auval -a | grep -i -A 2 -B 2 'Melodic-Atlas' || true
          echo "--- Actual AU load and validation ---"
          auval -v aumu MlAt BrAu

      - name: Verify bundled native CLAP weights and runtime (8B)
        if: (startsWith(github.ref, 'refs/heads/dev/8b-') || startsWith(github.ref, 'refs/heads/dev/8c-') || (startsWith(github.ref, 'refs/heads/dev/8d-') || (startsWith(github.ref, 'refs/heads/dev/8e-') || (startsWith(github.ref, 'refs/heads/dev/8f-') || (startsWith(github.ref, 'refs/heads/dev/8g-') || (startsWith(github.ref, 'refs/heads/dev/8h-') || (startsWith(github.ref, 'refs/heads/dev/8i-') || (startsWith(github.ref, 'refs/heads/dev/8j-') || (startsWith(github.ref, 'refs/heads/dev/8k-') || startsWith(github.ref, 'refs/heads/dev/8m-') || startsWith(github.ref, 'refs/heads/dev/8n-') || startsWith(github.ref, 'refs/heads/dev/8o-') || startsWith(github.ref, 'refs/heads/dev/8p-') || startsWith(github.ref, 'refs/heads/dev/9c-') || startsWith(github.ref, 'refs/heads/dev/9e-') || startsWith(github.ref, 'refs/heads/dev/9f-'))))))))))
        run: python Tools/verify_native_bundle_8b.py

      - name: Package macOS plugin bundles without losing executable permissions
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/dist
          cd build/MelodicAtlas_artefacts/Release
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent VST3/Melodic-Atlas.vst3 "$GITHUB_WORKSPACE/build/dist/Melodic-Atlas-VST3-macOS.zip"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent AU/Melodic-Atlas.component "$GITHUB_WORKSPACE/build/dist/Melodic-Atlas-AU-macOS.zip"

      - name: Upload macOS plugin ZIPs
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: build/dist/*.zip
          if-no-files-found: error

      - name: Upload Windows plugin files
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            build/MelodicAtlas_artefacts/Release/VST3/**
            build/MelodicAtlas_artefacts/Release/Standalone/**
